# Install only after the certificate exists. Preserve the other VPS vhosts.
server {
    listen 80;
    listen [::]:80;
    server_name charterstats.ru www.charterstats.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://charterstats.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.charterstats.ru;
    ssl_certificate /etc/letsencrypt/live/charterstats.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/charterstats.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://charterstats.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name charterstats.ru;
    ssl_certificate /etc/letsencrypt/live/charterstats.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/charterstats.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != charterstats.ru) { return 444; }

    client_max_body_size 25m;
    location ^~ /bootstrap/ {
        access_log off;
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:8785;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cookie_flags ~ secure httponly samesite=strict;
        proxy_read_timeout 360s;
        proxy_send_timeout 60s;
    }
}
