# TEMPLATE ONLY. Replace the example domain and certificate paths after approval.
# Requires nginx with proxy_cookie_flags support (1.19.3+).
server {
    listen 443 ssl;
    server_name charterstats.ru;

    ssl_certificate /etc/ssl/fleet/fullchain.pem;
    ssl_certificate_key /etc/ssl/fleet/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css;

    # Match FLEET_PUBLIC_HOST; overwrite, never append user-supplied headers.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cookie_flags ~ secure httponly samesite=strict;
    proxy_read_timeout 360s;
    proxy_send_timeout 60s;

    # The workspace response keeps its CSRF token in a header.
    location = /api/charter {
        gzip_types application/json;
        proxy_pass http://127.0.0.1:8765;
    }

    # Replace this host together with server_name; reject unmatched Host values.
    if ($host != charterstats.ru) { return 444; }

    client_max_body_size 25m;
    location ^~ /bootstrap/ {
        access_log off;
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
    }
}
